resources:
  jobs:
    axa_job:
      name: axa_job
      email_notifications:
        on_failure:
          - tlyemul@gmail.com
      notification_settings:
        no_alert_for_skipped_runs: true
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: /Workspace/Users/tlyemul@gmail.com/axa/axa_dabs/src/notebooks/bronze
            source: WORKSPACE
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: /Workspace/Users/tlyemul@gmail.com/axa/axa_dabs/src/notebooks/silver
            source: WORKSPACE
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: /Workspace/Users/tlyemul@gmail.com/axa/axa_dabs/src/notebooks/gold
            source: WORKSPACE
      queue:
        enabled: true
      parameters:
        - name: catalog
          default: ${var.catalog}
      performance_target: PERFORMANCE_OPTIMIZED
